{% extends 'base.html' %} 
{% block title %}Log In - Speech Practice{% endblock %}

{% block extra_css %}
<style>
    
    body {
        font-family: 'Segoe UI', sans-serif;
        background-color: #111827; 
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        flex-wrap: wrap;
    }

    
    main {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        padding-top: 60px;  
    }

    .login-container {
        background-color: #1f2937;  
        padding: 40px 30px;
        border-radius: 16px;
        box-shadow: 0 0 30px rgba(0, 173, 181, 0.25);
        width: 350px;
        color: #ffffff;
        text-align: center;
    }

    h2 {
        color: #00adb5;
        margin-bottom: 24px;
        font-weight: 600;
    }

    input[type="text"],
    input[type="password"] {
        width: 100%;
        padding: 12px;
        margin-bottom: 16px;
        border: none;
        border-radius: 8px;
        background-color: #374151;
        color: #ffffff;
        font-size: 15px;
        transition: box-shadow 0.3s ease, background-color 0.3s ease;
    }

    input[type="text"]::placeholder,
    input[type="password"]::placeholder {
        color: #9ca3af;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
        outline: none;
        background-color: #4b5563;
        box-shadow: 0 0 10px #00adb5;
    }

    button {
        width: 100%;
        padding: 12px;
        background: linear-gradient(to right, #00adb5, #007b8a);
        border: none;
        color: white;
        font-size: 16px;
        font-weight: 600;
        border-radius: 8px;
        cursor: pointer;
        transition: background 0.3s ease, transform 0.2s ease;
    }

    button:hover {
        background: linear-gradient(to right, #00ced1, #009ea6);
        transform: scale(1.02);
    }

    .errorlist {
        color: #ff4d4d;
        font-size: 14px;
        margin-bottom: 15px;
    }

    a {
        font-size: 14px;
        color: #00adb5;
        text-decoration: none;
        margin-top: 14px;
        display: inline-block;
    }

    a:hover {
        text-decoration: underline;
    }
    .navbar {
        width:100vw;
    }
    .navbar-content{
        justify-content: center;
        gap: 10px;
    }
    .navbar a{
        color: white;
        text-decoration: none;
        font-weigth: bold;
    }
</style>
{% endblock %}

{% block content %}
<main>
    <div class="login-container">
        <h2>Login</h2>
        {% if form.errors %}
            <p class="errorlist">Invalid username or password</p>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        <a href="{% url 'password_reset' %}">Forgot password?</a>
    </div>
</main>
{% endblock %}
