<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>{% block title %} Speech Practice {% endblock %}</title>
    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", sans-serif;
        background-color: #111;
        color: #f5f5f5;
      }

      a {
        text-decoration: none;
        color: #fff;
        margin-right: 20px;
        transition: color 0.3s;
      }

      a:hover {
        color: #1f5fa2 ; 
         
      }

      .navbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background-color: #2e5f94ff;
        padding: 10px 50px;
        position: sticky;
        top: 0;
        z-index: 1000;
      }

      .nav-left a,
      .nav-right a {
        font-weight: bold;
        font-size: 1rem;
      }

      .nav-left,
      .nav-right {
        display: flex;
        flex-direction: row;
        gap: 15px;
      }

      main,
      .container,
      .progress-container,
      .practice-container,
      login-container, .logout-container {
        margin-top: 0px; 
        padding: 20px;
      }
    </style>

    {% block extra_css %} 
    {% endblock %}
  </head>
  <body>
    <nav class="navbar">
      <div class="nav-left">
        
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'practice' %}">Practice</a>
        <a href="{% url 'progress' %}">Progress</a>
        
      </div>
      <div class="nav-right">
        <a href="{% url 'signup' %}">Sign Up</a>
        <a href="{% url 'login' %}">Login</a>
        <a href="{% url 'logged_out' %}">Logout</a>
      </div>
    </nav>
    <main id="container">{% block content %} {% endblock %}</main>
  </body>
</html>
